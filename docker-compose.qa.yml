services:
  postgres:
    ports: !override
      - "15432:5432"
    volumes: !override
      - qa_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  backend:
    ports: !override
      - "18000:8000"
    env_file: !override
      - path: .env.qa
        required: false
      - path: .env.qa.local
        required: false
    environment:
      APP_ENV: qa
      DATABASE_URL: postgres://offbook:offbook@postgres:5432/offbook_qa?sslmode=disable
      PORT: "8000"
      FRONTEND_URL: http://localhost:15173
      MIGRATIONS_PATH: /app/migrations

  frontend:
    ports: !override
      - "15173:80"

volumes:
  qa_postgres_data:
