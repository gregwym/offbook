services:
  postgres:
    ports: !override
      - "15432:5432"
    volumes: !override
      - qa_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  backend:
    ports: !override
      - "18000:8000"
    environment:
      FRONTEND_URL: http://localhost:15173

  frontend:
    ports: !override
      - "15173:80"

volumes:
  qa_postgres_data:
