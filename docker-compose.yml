services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: offbook
      POSTGRES_PASSWORD: offbook
      POSTGRES_DB: offbook_dev
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      # Init scripts run only on first volume creation (when the data dir is
      # empty). They provision the test DB alongside the dev DB so `make test`
      # never touches dev rows. See #183 + infra/postgres/init/.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offbook -d offbook_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      DATABASE_URL: postgres://offbook:offbook@postgres:5432/offbook_dev?sslmode=disable
      PORT: "8000"
      FRONTEND_URL: http://localhost:5173
      MIGRATIONS_PATH: /app/migrations
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
