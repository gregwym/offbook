# Tailscale sidecar override — exposes the composed `frontend` over HTTPS at
# https://${TS_HOSTNAME}.<tailnet>.ts.net. Instance-agnostic: compose with any
# base stack; instance identity comes from the compose project name.
#
# Env (soft defaults — see below). Both are Tailscale IDENTITY: consumed ONLY
# when the sidecar is first created/registered, never stored in the env file —
# pass them once on the first-boot command line.
#   TS_AUTHKEY   Tailscale auth key (tskey-...). Prefer per-instance, tagged.
#   TS_HOSTNAME  MagicDNS name for this node (e.g. offbook, offbook-prod).
#
# These use `:-` (default empty) rather than `:?` (fail-fast) so an app-only
# `up --no-deps backend frontend` — which parses this file but doesn't touch the
# sidecar — doesn't demand them. `make deploy` guards BOTH at first boot (when
# the sidecar is actually created); after that the sidecar runs from its state
# volume and needs neither value again.
#
# Example (first boot):
#   command make deploy TS_AUTHKEY=tskey-... TS_HOSTNAME=offbook
#
# See ADR-0016 for rationale.
services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      # Optional. Pass extra `tailscaled` flags here, e.g. --advertise-tags=tag:X.
      # Leave empty when your auth key already auto-applies a tag (common when
      # using a reusable + ACL-restricted key) — explicit --advertise-tags
      # *overrides* the key's tags and will fail registration if the key's
      # identity doesn't have permission for the new tag.
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
      # Serve config is rendered into a file the sidecar reads; the frontend
      # service in the merged compose graph must be reachable as `frontend:80`.
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./infra/tailscale/serve.json:/config/serve.json:ro
    depends_on:
      - frontend
    restart: unless-stopped

  # Restart-policy overlays on the app services. The base docker-compose.yml
  # leaves these unset (`no`) so the hot-reload dev workflow can bring
  # containers up/down deliberately. When you're composing with this file
  # you're running a long-lived deployment — surviving a Colima/Docker
  # restart should not require manual intervention.
  postgres:
    restart: unless-stopped
  backend:
    restart: unless-stopped
  frontend:
    restart: unless-stopped

volumes:
  tailscale_state:
