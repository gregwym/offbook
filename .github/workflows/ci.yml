name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs when a new commit lands on the same ref —
# saves runner minutes on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sub-second static check (#273) — every apiClient.<method>('<path>')
  # in frontend/src/api/*.ts must map to a registered backend handler
  # route. Catches the bug class behind #266 / #268: backend route
  # removed without migrating frontend callers. No DB or stack needed.
  contract-check:
    name: Contract check (frontend↔backend routes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run contract-check
        working-directory: backend
        run: go run ./cmd/contract-check

  backend-lint:
    name: Backend lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The official golangci-lint-action pins a binary release that is
      # frequently behind on Go toolchain support — the v2.5.0 binary
      # was built with Go 1.25 and refuses to lint a Go 1.26 module
      # ("language version used to build golangci-lint is lower").
      # The Docker image keeps pace and is the same surface `make lint`
      # uses locally, so CI and dev see identical results.
      - name: golangci-lint (docker)
        run: docker run --rm -v "$PWD/backend":/app -w /app golangci/golangci-lint:latest-alpine golangci-lint run ./...

  backend-test:
    name: Backend test (go test against Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: offbook
          POSTGRES_PASSWORD: offbook
          POSTGRES_DB: offbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U offbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://offbook:offbook@localhost:5432/offbook_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Apply migrations
        run: go run ./cmd/migrate up
      - name: go vet
        run: go vet ./...
      - name: go test
        # -p 1 serializes package execution. Integration tests share one
        # DATABASE_URL, so parallel packages step on each other's rows.
        run: go test -race -p 1 ./...

  migration-roundtrip:
    name: Migration round-trip (up→down→up)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: offbook
          POSTGRES_PASSWORD: offbook
          POSTGRES_DB: offbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U offbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://offbook:offbook@localhost:5432/offbook_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Asserts every migration reverses cleanly and seed data re-lands (#358).
      # Runs against the throwaway offbook_test DB — the tool refuses any other.
      - name: Migration round-trip
        run: go run ./cmd/migrate-roundtrip

  schema-check:
    name: Schema report up-to-date
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: offbook
          POSTGRES_PASSWORD: offbook
          POSTGRES_DB: offbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U offbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://offbook:offbook@localhost:5432/offbook_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Apply migrations
        run: go run ./cmd/migrate up
      # Fails if a migration changed the schema but docs/db/schema.md wasn't
      # regenerated with `make schema`. The report is deterministic +
      # DB-name-independent, so it matches what a developer commits locally.
      - name: Check schema report is current
        run: go run ./cmd/schema-report --check --out ../docs/db/schema.md

  frontend-build:
    name: Frontend build (pnpm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  qa-smoke:
    name: QA acceptance baseline smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: acceptance/pnpm-lock.yaml
      # Ephemeral QA secrets for this run only — never committed, never reused
      # across runs. qa-preflight.sh refuses placeholder SESSION_SECRET values,
      # so these must be real random ones even in CI.
      - name: Generate QA env
        run: |
          cp .env.qa.example .env.qa
          {
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "QA_SECRET=$(openssl rand -hex 32)"
          } >> .env.qa
      - name: Boot QA stack
        run: docker compose -p offbook-qa -f docker-compose.yml -f docker-compose.qa.yml up -d --build
      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:18000/api/v1/health >/dev/null; then
              echo "backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy in time" >&2
          docker compose -p offbook-qa -f docker-compose.yml -f docker-compose.qa.yml logs --no-color
          exit 1
      - name: Install acceptance deps
        working-directory: acceptance
        run: pnpm install --frozen-lockfile
      # PLAYWRIGHT_BROWSERS_PATH must match what `make qa-smoke` uses
      # (Makefile default: acceptance/.cache/ms-playwright) or the test run
      # can't find the browser it just installed.
      - name: Install Playwright Chromium
        working-directory: acceptance
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Bootstrap QA personas
        env:
          OFFBOOK_ROLE: qa
        run: node acceptance/fixtures/bootstrap.mjs
      - name: Run baseline smoke
        env:
          OFFBOOK_ROLE: qa
        run: make qa-smoke
      - name: QA stack logs
        if: failure()
        run: docker compose -p offbook-qa -f docker-compose.yml -f docker-compose.qa.yml logs --no-color
      - name: Tear down QA stack
        if: always()
        run: docker compose -p offbook-qa -f docker-compose.yml -f docker-compose.qa.yml down -v
