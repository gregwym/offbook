# On-demand isolated QA execution host (#426). Cloud QA sessions cannot always
# pull Docker images (Docker Hub 429), so GitHub Actions boots the isolated
# offbook-qa stack, runs a Playwright suite on desktop + mobile, and uploads
# sanitized traces/screenshots/video plus a structured result. Synthetic data
# only; no production secrets. This is evidence for the QA agent, not a
# substitute for independent product-experience review.
name: QA journeys

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to test (default main)
        required: false
        default: main
      suite:
        description: Playwright suite/spec pattern (e.g. smoke, plaid)
        required: false
        default: smoke
      restart_between:
        description: Soak only (#631) — run SOAK_PHASE=seed, restart the backend, then SOAK_PHASE=verify
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: qa-journeys
  cancel-in-progress: false

jobs:
  journeys:
    name: QA journeys (${{ inputs.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: acceptance/pnpm-lock.yaml
      - name: Record tested SHA
        run: echo "TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Generate QA env
        run: |
          cp .env.qa.example .env.qa
          {
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "QA_SECRET=$(openssl rand -hex 32)"
          } >> .env.qa
      - name: Boot QA stack
        run: docker compose -p offbook-qa -f docker-compose.yml -f docker-compose.qa.yml up -d --build
      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:18000/api/v1/health >/dev/null && exit 0
            sleep 2
          done
          docker compose -p offbook-qa -f docker-compose.yml -f docker-compose.qa.yml logs --no-color
          exit 1
      - name: Install acceptance deps
        working-directory: acceptance
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: acceptance
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Bootstrap QA personas
        env:
          OFFBOOK_ROLE: qa
        run: node acceptance/fixtures/bootstrap.mjs
      - name: Run suite with full evidence
        if: ${{ !inputs.restart_between }}
        env:
          OFFBOOK_ROLE: qa
          ACCEPTANCE_EVIDENCE: "1"
          QA_SUITE: ${{ inputs.suite }}
          QA_SOAK: ${{ contains(inputs.suite, 'soak') && '1' || '0' }}
        run: make qa-suite QA_SUITE="$QA_SUITE"
      # Stability soak across a process restart (#631): seed and run the
      # rounds, restart only the backend container (same database volume),
      # wait for /health, then re-assert the saved baseline and run one more
      # round. The seed phase's report is moved aside so verify can't
      # overwrite it; both land in qa-evidence.
      - name: Soak seed phase
        if: ${{ inputs.restart_between }}
        env:
          OFFBOOK_ROLE: qa
          ACCEPTANCE_EVIDENCE: "1"
          QA_SUITE: ${{ inputs.suite }}
          QA_SOAK: "1"
          SOAK_PHASE: seed
        run: |
          make qa-suite QA_SUITE="$QA_SUITE"
          mkdir -p acceptance/reports/seed-phase
          mv acceptance/reports/html acceptance/reports/artifacts acceptance/reports/seed-phase/
      - name: Restart backend
        if: ${{ inputs.restart_between }}
        run: |
          compose="docker compose -p offbook-qa -f docker-compose.yml -f docker-compose.qa.yml"
          before=$(docker inspect -f '{{.State.StartedAt}}' "$($compose ps -q backend)")
          $compose restart backend
          for i in $(seq 1 60); do
            curl -sf http://localhost:18000/api/v1/health >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:18000/api/v1/health >/dev/null
          after=$(docker inspect -f '{{.State.StartedAt}}' "$($compose ps -q backend)")
          test "$before" != "$after"
          mkdir -p acceptance/reports/soak
          printf '{"backend_started_before":"%s","backend_started_after":"%s"}\n' "$before" "$after" \
            > acceptance/reports/soak/restart.json
      - name: Soak verify phase
        if: ${{ inputs.restart_between }}
        env:
          OFFBOOK_ROLE: qa
          ACCEPTANCE_EVIDENCE: "1"
          QA_SUITE: ${{ inputs.suite }}
          QA_SOAK: "1"
          SOAK_PHASE: verify
        run: make qa-suite QA_SUITE="$QA_SUITE"
      - name: Summarize results
        if: always()
        run: |
          {
            echo "## QA journeys"
            echo "- tested SHA: \`${TESTED_SHA}\`"
            echo "- suite: \`${{ inputs.suite }}\` (desktop-chromium + mobile-chromium)"
            echo "- restart between phases: \`${{ inputs.restart_between }}\`"
            echo "- job status: \`${{ job.status }}\`"
            echo "- evidence: download the \`qa-evidence\` artifact (HTML report, traces, screenshots, video)"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p acceptance/reports
          printf '{"sha":"%s","suite":"%s","status":"%s","run":"%s"}\n' \
            "$TESTED_SHA" "${{ inputs.suite }}" "${{ job.status }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > acceptance/reports/result.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: acceptance/reports
          retention-days: 14
          if-no-files-found: warn
      - name: QA stack logs
        if: failure()
        run: docker compose -p offbook-qa -f docker-compose.yml -f docker-compose.qa.yml logs --no-color
      - name: Tear down QA stack
        if: always()
        run: docker compose -p offbook-qa -f docker-compose.yml -f docker-compose.qa.yml down -v
